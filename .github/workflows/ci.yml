name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate gallery manifest
        run: python scripts/generate_gallery.py

      - name: Run Python site checks
        run: python tests/site_test.py

      - name: Run Python enquiry validation checks
        run: python tests/enquiry_validation_test.py

      - name: Run Node test suite
        run: npm test
